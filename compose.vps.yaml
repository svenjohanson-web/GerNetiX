name: gernetix

x-node-service: &node-service
  build:
    context: .
    dockerfile: docker/node-service.Dockerfile
  image: gernetix/node-services:${GERNETIX_IMAGE_TAG:-local}
  init: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  networks:
    - backend
  healthcheck:
    test: ["CMD", "node", "/app/docker/healthcheck.js"]
    interval: 15s
    timeout: 4s
    retries: 5
    start_period: 10s

services:
  runtime-postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: gernetix_runtime
      POSTGRES_USER: gernetix_runtime
      POSTGRES_PASSWORD: ${RUNTIME_POSTGRES_PASSWORD:?RUNTIME_POSTGRES_PASSWORD muss gesetzt sein}
    expose: ["5432"]
    ports:
      - "${RUNTIME_POSTGRES_BIND_ADDRESS:-127.0.0.1}:${RUNTIME_POSTGRES_HOST_PORT:-25432}:5432"
    networks:
      - backend
      - runtime-postgres-access
    volumes:
      - runtime_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gernetix_runtime -d gernetix_runtime"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  forgejo-postgres-provisioning:
    <<: *node-service
    restart: "no"
    healthcheck:
      disable: true
    command: ["node", "/app/tools/provision-forgejo-postgres.js"]
    environment:
      RUNTIME_POSTGRES_HOST: runtime-postgres
      RUNTIME_POSTGRES_PORT: 5432
      RUNTIME_POSTGRES_USER: gernetix_runtime
      RUNTIME_POSTGRES_PASSWORD: ${RUNTIME_POSTGRES_PASSWORD:?RUNTIME_POSTGRES_PASSWORD muss gesetzt sein}
      FORGEJO_POSTGRES_PASSWORD: ${FORGEJO_POSTGRES_PASSWORD:?FORGEJO_POSTGRES_PASSWORD muss gesetzt sein}
    volumes:
      - ./tools/provision-forgejo-postgres.js:/app/tools/provision-forgejo-postgres.js:ro
    depends_on:
      runtime-postgres: { condition: service_healthy }

  forgejo:
    image: codeberg.org/forgejo/forgejo:15.0.6-rootless
    user: "1000:1000"
    init: true
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 60s
    environment:
      USER_UID: 1000
      USER_GID: 1000
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: runtime-postgres:5432
      FORGEJO__database__NAME: forgejo
      FORGEJO__database__USER: forgejo
      FORGEJO__database__PASSWD: ${FORGEJO_POSTGRES_PASSWORD:?FORGEJO_POSTGRES_PASSWORD muss gesetzt sein}
      FORGEJO__database__SSL_MODE: disable
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__security__SECRET_KEY: ${FORGEJO_SECRET_KEY:?FORGEJO_SECRET_KEY muss gesetzt sein}
      FORGEJO__security__INTERNAL_TOKEN: ${FORGEJO_INTERNAL_TOKEN:?FORGEJO_INTERNAL_TOKEN muss gesetzt sein}
      FORGEJO__security__REVERSE_PROXY_TRUSTED_PROXIES: 127.0.0.0/8,::1/128
      FORGEJO__security__DISABLE_GIT_HOOKS: "true"
      FORGEJO__security__DISABLE_WEBHOOKS: "true"
      FORGEJO__server__DOMAIN: forgejo
      FORGEJO__server__ROOT_URL: http://forgejo:3000/
      FORGEJO__server__HTTP_PORT: 3000
      FORGEJO__server__PROTOCOL: http
      FORGEJO__server__DISABLE_SSH: "true"
      FORGEJO__server__START_SSH_SERVER: "false"
      FORGEJO__server__LFS_START_SERVER: "false"
      FORGEJO__server__OFFLINE_MODE: "true"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__service__SHOW_REGISTRATION_BUTTON: "false"
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: "true"
      FORGEJO__service__DEFAULT_ALLOW_CREATE_ORGANIZATION: "false"
      FORGEJO__repository__ENABLE_PUSH_CREATE_USER: "false"
      FORGEJO__repository__ENABLE_PUSH_CREATE_ORG: "false"
      FORGEJO__repository__DISABLED_REPO_UNITS: repo.issues,repo.ext_issues,repo.pulls,repo.wiki,repo.ext_wiki,repo.projects,repo.packages,repo.actions
      FORGEJO__repository__DEFAULT_REPO_UNITS: repo.code,repo.releases
      FORGEJO__admin__DISABLE_REGULAR_ORG_CREATION: "true"
      FORGEJO__actions__ENABLED: "false"
      FORGEJO__packages__ENABLED: "false"
      FORGEJO__openid__ENABLE_OPENID_SIGNIN: "false"
      FORGEJO__openid__ENABLE_OPENID_SIGNUP: "false"
      FORGEJO__oauth2_client__ENABLE_AUTO_REGISTRATION: "false"
      FORGEJO__mailer__ENABLED: "false"
      FORGEJO__federation__ENABLED: "false"
      FORGEJO__cron.update_checker__ENABLED: "false"
      FORGEJO__api__ENABLE_SWAGGER: "false"
      FORGEJO__metrics__ENABLED: "false"
    expose: ["3000"]
    networks:
      - backend
    volumes:
      - forgejo_data:/var/lib/gitea
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/api/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      forgejo-postgres-provisioning: { condition: service_completed_successfully }

  identity-postgres-migration:
    <<: *node-service
    restart: "no"
    healthcheck:
      disable: true
    command: ["node", "/app/tools/migrate-identity-sqlite-to-postgres.js"]
    environment:
      IDENTITY_SQLITE_PATH: /var/lib/gernetix/identity/gernetix-identity.sqlite
      IDENTITY_POSTGRES_HOST: runtime-postgres
      IDENTITY_POSTGRES_PORT: 5432
      IDENTITY_POSTGRES_DATABASE: gernetix_runtime
      IDENTITY_POSTGRES_USER: gernetix_runtime
      IDENTITY_POSTGRES_PASSWORD: ${RUNTIME_POSTGRES_PASSWORD:?RUNTIME_POSTGRES_PASSWORD muss gesetzt sein}
    volumes:
      - identity_state:/var/lib/gernetix/identity:ro
    depends_on:
      runtime-postgres: { condition: service_healthy }

  project-postgres-migration:
    <<: *node-service
    restart: "no"
    healthcheck:
      disable: true
    command: ["node", "/app/tools/migrate-project-sqlite-to-postgres.js"]
    environment:
      PROJECT_SERVER_SQLITE_PATH: /var/lib/gernetix/projects/gernetix-projects.sqlite
      PROJECT_LEGACY_SHARED_SQLITE_PATH: /var/lib/gernetix/services/gernetix-services.sqlite
      PROJECT_POSTGRES_HOST: runtime-postgres
      PROJECT_POSTGRES_PORT: 5432
      PROJECT_POSTGRES_DATABASE: gernetix_runtime
      PROJECT_POSTGRES_USER: gernetix_runtime
      PROJECT_POSTGRES_PASSWORD: ${RUNTIME_POSTGRES_PASSWORD:?RUNTIME_POSTGRES_PASSWORD muss gesetzt sein}
    volumes:
      - project_state:/var/lib/gernetix/projects:ro
      - service_state:/var/lib/gernetix/services:ro
    depends_on:
      runtime-postgres: { condition: service_healthy }

  telemetry-postgres-migration:
    <<: *node-service
    restart: "no"
    healthcheck:
      disable: true
    command: ["node", "/app/tools/migrate-telemetry-sqlite-to-postgres.js"]
    environment:
      TELEMETRY_SQLITE_PATH: /var/lib/gernetix/telemetry/gernetix-telemetry.sqlite
      TELEMETRY_LEGACY_SHARED_SQLITE_PATH: /var/lib/gernetix/services/gernetix-services.sqlite
      TELEMETRY_POSTGRES_HOST: runtime-postgres
      TELEMETRY_POSTGRES_PORT: 5432
      TELEMETRY_POSTGRES_DATABASE: gernetix_runtime
      TELEMETRY_POSTGRES_USER: gernetix_runtime
      TELEMETRY_POSTGRES_PASSWORD: ${RUNTIME_POSTGRES_PASSWORD:?RUNTIME_POSTGRES_PASSWORD muss gesetzt sein}
    volumes:
      - telemetry_state:/var/lib/gernetix/telemetry:ro
      - service_state:/var/lib/gernetix/services:ro
    depends_on:
      runtime-postgres: { condition: service_healthy }

  community-postgres-migration:
    <<: *node-service
    restart: "no"
    healthcheck:
      disable: true
    command: ["node", "/app/tools/migrate-community-sqlite-to-postgres.js"]
    environment:
      COMMUNITY_SQLITE_PATH: /var/lib/gernetix/community/gernetix-community.sqlite
      COMMUNITY_POSTGRES_HOST: runtime-postgres
      COMMUNITY_POSTGRES_PORT: 5432
      COMMUNITY_POSTGRES_DATABASE: gernetix_runtime
      COMMUNITY_POSTGRES_USER: gernetix_runtime
      COMMUNITY_POSTGRES_PASSWORD: ${RUNTIME_POSTGRES_PASSWORD:?RUNTIME_POSTGRES_PASSWORD muss gesetzt sein}
    volumes:
      - community_state:/var/lib/gernetix/community:ro
    depends_on:
      runtime-postgres: { condition: service_healthy }

  device-management-postgres-migration:
    <<: *node-service
    restart: "no"
    healthcheck:
      disable: true
    command: ["node", "/app/tools/migrate-device-management-sqlite-to-postgres.js"]
    environment:
      DEVICE_MANAGEMENT_SQLITE_PATH: /var/lib/gernetix/services/gernetix-services.sqlite
      DEVICE_MANAGEMENT_POSTGRES_HOST: runtime-postgres
      DEVICE_MANAGEMENT_POSTGRES_PORT: 5432
      DEVICE_MANAGEMENT_POSTGRES_DATABASE: gernetix_runtime
      DEVICE_MANAGEMENT_POSTGRES_USER: gernetix_runtime
      DEVICE_MANAGEMENT_POSTGRES_PASSWORD: ${RUNTIME_POSTGRES_PASSWORD:?RUNTIME_POSTGRES_PASSWORD muss gesetzt sein}
    volumes:
      - service_state:/var/lib/gernetix/services:ro
    depends_on:
      runtime-postgres: { condition: service_healthy }

  ai-usage-postgres-migration:
    <<: *node-service
    restart: "no"
    healthcheck:
      disable: true
    command: ["node", "/app/tools/migrate-ai-usage-sqlite-to-postgres.js"]
    environment:
      AI_USAGE_SQLITE_PATH: /var/lib/gernetix/services/gernetix-services.sqlite
      AI_USAGE_POSTGRES_HOST: runtime-postgres
      AI_USAGE_POSTGRES_PORT: 5432
      AI_USAGE_POSTGRES_DATABASE: gernetix_runtime
      AI_USAGE_POSTGRES_USER: gernetix_runtime
      AI_USAGE_POSTGRES_PASSWORD: ${RUNTIME_POSTGRES_PASSWORD:?RUNTIME_POSTGRES_PASSWORD muss gesetzt sein}
    volumes:
      - service_state:/var/lib/gernetix/services:ro
    depends_on:
      runtime-postgres: { condition: service_healthy }

  hardware-catalog-postgres-migration:
    <<: *node-service
    restart: "no"
    healthcheck:
      disable: true
    command: ["node", "/app/tools/migrate-hardware-catalog-sqlite-to-postgres.js"]
    environment:
      HARDWARE_CATALOG_SQLITE_PATH: /var/lib/gernetix/services/gernetix-services.sqlite
      HARDWARE_CATALOG_POSTGRES_HOST: runtime-postgres
      HARDWARE_CATALOG_POSTGRES_PORT: 5432
      HARDWARE_CATALOG_POSTGRES_DATABASE: gernetix_runtime
      HARDWARE_CATALOG_POSTGRES_USER: gernetix_runtime
      HARDWARE_CATALOG_POSTGRES_PASSWORD: ${RUNTIME_POSTGRES_PASSWORD:?RUNTIME_POSTGRES_PASSWORD muss gesetzt sein}
    volumes:
      - service_state:/var/lib/gernetix/services:ro
    depends_on:
      runtime-postgres: { condition: service_healthy }

  hardware-shop-postgres-migration:
    <<: *node-service
    restart: "no"
    healthcheck:
      disable: true
    command: ["node", "/app/tools/migrate-hardware-shop-sqlite-to-postgres.js"]
    environment:
      HARDWARE_SHOP_SQLITE_PATH: /var/lib/gernetix/services/gernetix-services.sqlite
      HARDWARE_SHOP_POSTGRES_HOST: runtime-postgres
      HARDWARE_SHOP_POSTGRES_PORT: 5432
      HARDWARE_SHOP_POSTGRES_DATABASE: gernetix_runtime
      HARDWARE_SHOP_POSTGRES_USER: gernetix_runtime
      HARDWARE_SHOP_POSTGRES_PASSWORD: ${RUNTIME_POSTGRES_PASSWORD:?RUNTIME_POSTGRES_PASSWORD muss gesetzt sein}
    volumes:
      - service_state:/var/lib/gernetix/services:ro
    depends_on:
      runtime-postgres: { condition: service_healthy }

  operations-postgres-migration:
    <<: *node-service
    restart: "no"
    healthcheck:
      disable: true
    command: ["node", "/app/tools/migrate-operations-sqlite-to-postgres.js"]
    environment:
      OPERATIONS_SQLITE_PATH: /var/lib/gernetix/services/gernetix-services.sqlite
      OPERATIONS_POSTGRES_HOST: runtime-postgres
      OPERATIONS_POSTGRES_PORT: 5432
      OPERATIONS_POSTGRES_DATABASE: gernetix_runtime
      OPERATIONS_POSTGRES_USER: gernetix_runtime
      OPERATIONS_POSTGRES_PASSWORD: ${RUNTIME_POSTGRES_PASSWORD:?RUNTIME_POSTGRES_PASSWORD muss gesetzt sein}
    volumes:
      - service_state:/var/lib/gernetix/services:ro
    depends_on:
      runtime-postgres: { condition: service_healthy }

  runtime-postgres-migration:
    <<: *node-service
    restart: "no"
    healthcheck:
      disable: true
    command: ["node", "/app/tools/migrate-runtime-sqlite-to-postgres.js"]
    environment:
      RUNTIME_POSTGRES_HOST: runtime-postgres
      RUNTIME_POSTGRES_PORT: 5432
      RUNTIME_POSTGRES_DATABASE: gernetix_runtime
      RUNTIME_POSTGRES_USER: gernetix_runtime
      RUNTIME_POSTGRES_PASSWORD: ${RUNTIME_POSTGRES_PASSWORD:?RUNTIME_POSTGRES_PASSWORD muss gesetzt sein}
      RUNTIME_STATE_ENCRYPTION_KEY: ${RUNTIME_STATE_ENCRYPTION_KEY:?RUNTIME_STATE_ENCRYPTION_KEY muss gesetzt sein}
      IDENTITY_SQLITE_PATH: /var/lib/gernetix/identity/gernetix-identity.sqlite
      PLATFORM_DOWNLOAD_SQLITE_PATH: /var/lib/gernetix/identity/gernetix-platform-downloads.sqlite
      ACCOUNT_ASSET_SQLITE_PATH: /var/lib/gernetix/identity/gernetix-account-assets.sqlite
      ADMIN_ACCESS_SQLITE_PATH: /var/lib/gernetix/admin-access/gernetix-admin-access.sqlite
      PUBLIC_DEMO_SQLITE_PATH: /var/lib/gernetix/public-demos/gernetix-public-demos.sqlite
      BUILD_ARTIFACT_SQLITE_PATH: /var/lib/gernetix/build/gernetix-build-artifacts.sqlite
      LLM_CONFIG_PATH: /var/lib/gernetix/services/identity-llm-config.json
    volumes:
      - identity_state:/var/lib/gernetix/identity:ro
      - admin_access_state:/var/lib/gernetix/admin-access:ro
      - public_demo_state:/var/lib/gernetix/public-demos:ro
      - build_state:/var/lib/gernetix/build:ro
      - service_state:/var/lib/gernetix/services:ro
    depends_on:
      runtime-postgres: { condition: service_healthy }

  postgres-consolidation-migration:
    <<: *node-service
    profiles: ["postgres-consolidation"]
    restart: "no"
    healthcheck:
      disable: true
    command: ["node", "/app/tools/migrate-postgres-domains-to-runtime.js"]
    environment:
      RUNTIME_POSTGRES_HOST: runtime-postgres
      RUNTIME_POSTGRES_PORT: 5432
      RUNTIME_POSTGRES_DATABASE: gernetix_runtime
      RUNTIME_POSTGRES_USER: gernetix_runtime
      RUNTIME_POSTGRES_PASSWORD: ${RUNTIME_POSTGRES_PASSWORD:?RUNTIME_POSTGRES_PASSWORD muss gesetzt sein}
      LEGACY_IDENTITY_POSTGRES_PASSWORD: ${IDENTITY_POSTGRES_PASSWORD:-}
      LEGACY_PROJECT_POSTGRES_PASSWORD: ${PROJECT_POSTGRES_PASSWORD:-}
      LEGACY_TELEMETRY_POSTGRES_PASSWORD: ${TELEMETRY_POSTGRES_PASSWORD:-}
      LEGACY_COMMUNITY_POSTGRES_PASSWORD: ${COMMUNITY_POSTGRES_PASSWORD:-}
      LEGACY_DEVICE_MANAGEMENT_POSTGRES_PASSWORD: ${DEVICE_MANAGEMENT_POSTGRES_PASSWORD:-}
      LEGACY_AI_USAGE_POSTGRES_PASSWORD: ${AI_USAGE_POSTGRES_PASSWORD:-}
      LEGACY_HARDWARE_CATALOG_POSTGRES_PASSWORD: ${HARDWARE_CATALOG_POSTGRES_PASSWORD:-}
      LEGACY_HARDWARE_SHOP_POSTGRES_PASSWORD: ${HARDWARE_SHOP_POSTGRES_PASSWORD:-}
      LEGACY_OPERATIONS_POSTGRES_PASSWORD: ${OPERATIONS_POSTGRES_PASSWORD:-}
      LEGACY_AI_CONTEXT_POSTGRES_PASSWORD: ${AI_CONTEXT_POSTGRES_PASSWORD:-}
    depends_on:
      runtime-postgres: { condition: service_healthy }

  project-server:
    <<: *node-service
    networks:
      - backend
      - loopback-access
    environment:
      GERNETIX_SERVICE: project-server
      HOST: 0.0.0.0
      PORT: 4800
      PERSISTENCE_BACKEND: postgres
      PROJECT_POSTGRES_HOST: runtime-postgres
      PROJECT_POSTGRES_PORT: 5432
      PROJECT_POSTGRES_DATABASE: gernetix_runtime
      PROJECT_POSTGRES_USER: gernetix_runtime
      PROJECT_POSTGRES_PASSWORD: ${RUNTIME_POSTGRES_PASSWORD:?RUNTIME_POSTGRES_PASSWORD muss gesetzt sein}
      PROJECT_REPOSITORY_STORE: ${PROJECT_REPOSITORY_STORE:-sql}
      PROJECT_REQUIRE_FORGEJO_NEW_PROJECTS: ${PROJECT_REQUIRE_FORGEJO_NEW_PROJECTS:-false}
      PROJECT_ADMIN_READ_TOKEN: ${PROJECT_ADMIN_READ_TOKEN:?PROJECT_ADMIN_READ_TOKEN muss gesetzt sein}
      FORGEJO_INTERNAL_URL: http://forgejo:3000
      FORGEJO_PROJECT_ORGANIZATION: gernetix-projects
      FORGEJO_PROJECT_DEFAULT_BRANCH: main
      FORGEJO_PROVISION_TOKEN: ${FORGEJO_PROVISION_TOKEN:-}
      FORGEJO_RUNTIME_TOKEN: ${FORGEJO_RUNTIME_TOKEN:-}
      FORGEJO_ESP32_BASIS_COMMIT: ${FORGEJO_ESP32_BASIS_COMMIT:-}
      FORGEJO_ESP8266_BASIS_COMMIT: ${FORGEJO_ESP8266_BASIS_COMMIT:-}
      FORGEJO_NEXI_COMMIT: ${FORGEJO_NEXI_COMMIT:-}
      FORGEJO_FLASHBOX_COMMIT: ${FORGEJO_FLASHBOX_COMMIT:-}
      FORGEJO_ESP8266_GAME_COLLECTION_COMMIT: ${FORGEJO_ESP8266_GAME_COLLECTION_COMMIT:-}
      FORGEJO_ESP32_GAME_COLLECTION_COMMIT: ${FORGEJO_ESP32_GAME_COLLECTION_COMMIT:-}
    expose: ["4800"]
    ports:
      - "127.0.0.1:4800:4800"
    depends_on:
      project-postgres-migration: { condition: service_completed_successfully }
      forgejo: { condition: service_healthy }

  compute-control-plane:
    <<: *node-service
    networks:
      - backend
      - worker-access
    environment:
      GERNETIX_SERVICE: compute-control-plane
      HOST: 0.0.0.0
      PORT: 5700
      COMPUTE_PERSISTENCE_BACKEND: postgres
      COMPUTE_POSTGRES_HOST: runtime-postgres
      COMPUTE_POSTGRES_PORT: 5432
      COMPUTE_POSTGRES_DATABASE: gernetix_runtime
      COMPUTE_POSTGRES_USER: gernetix_runtime
      COMPUTE_POSTGRES_PASSWORD: ${RUNTIME_POSTGRES_PASSWORD:?RUNTIME_POSTGRES_PASSWORD muss gesetzt sein}
      COMPUTE_INTERNAL_TOKEN: ${COMPUTE_INTERNAL_TOKEN:?COMPUTE_INTERNAL_TOKEN muss gesetzt sein}
      COMPUTE_WORKER_BOOTSTRAP_TOKEN: ${COMPUTE_WORKER_BOOTSTRAP_TOKEN:?COMPUTE_WORKER_BOOTSTRAP_TOKEN muss gesetzt sein}
      COMPUTE_WORKER_SIGNING_SECRET: ${COMPUTE_WORKER_SIGNING_SECRET:?COMPUTE_WORKER_SIGNING_SECRET muss gesetzt sein}
      COMPUTE_PROJECT_GRANT_SIGNING_SECRET: ${COMPUTE_PROJECT_GRANT_SIGNING_SECRET:?COMPUTE_PROJECT_GRANT_SIGNING_SECRET muss gesetzt sein}
      COMPUTE_WORKER_TOKEN_TTL_SECONDS: ${COMPUTE_WORKER_TOKEN_TTL_SECONDS:-900}
      COMPUTE_LEASE_TTL_MS: ${COMPUTE_LEASE_TTL_MS:-60000}
    expose: ["5700"]
    ports:
      - "${COMPUTE_BIND_ADDRESS:-127.0.0.1}:${COMPUTE_PORT:-5700}:5700"
    depends_on:
      runtime-postgres:
        condition: service_healthy
      runtime-postgres-migration:
        condition: service_completed_successfully

  build-deploy-server:
    <<: *node-service
    networks:
      - edge
      - backend
    environment:
      GERNETIX_SERVICE: build-deploy-server
      HOST: 0.0.0.0
      PORT: 4400
      PERSISTENCE_BACKEND: memory
      BUILD_ARTIFACT_PERSISTENCE_BACKEND: postgres
      BUILD_ARTIFACT_UPLOAD_TOKEN: ${BUILD_ARTIFACT_UPLOAD_TOKEN:?BUILD_ARTIFACT_UPLOAD_TOKEN muss gesetzt sein}
      BUILD_ARTIFACT_UPLOAD_STAGING_DIR: /var/lib/gernetix/build/artifact-upload-staging
      BUILD_ARTIFACT_UPLOAD_MAX_STORED_BYTES: 67108864
      BUILD_ARTIFACT_UPLOAD_MAX_ORIGINAL_BYTES: 134217728
      BUILD_ARTIFACT_UPLOAD_STALE_MS: 3600000
      BUILD_COORDINATION_BACKEND: postgres
      BUILD_COORDINATION_POOL_MAX: 20
      BUILD_WORKER_HEARTBEAT_MS: 15000
      BUILD_WORKER_STALE_MS: 120000
      BUILD_CANCELLATION_POLL_MS: 500
      BUILD_POSTGRES_HOST: runtime-postgres
      BUILD_POSTGRES_PORT: 5432
      BUILD_POSTGRES_DATABASE: gernetix_runtime
      BUILD_POSTGRES_USER: gernetix_runtime
      BUILD_POSTGRES_PASSWORD: ${RUNTIME_POSTGRES_PASSWORD:?RUNTIME_POSTGRES_PASSWORD muss gesetzt sein}
      BUILD_DEPLOY_RUNTIME_DIR: /var/lib/gernetix/build
      BUILD_RUNNER: platformio
      PLATFORMIO_COMMAND: /opt/platformio/bin/platformio
      PUBLIC_BASE_URL: https://build.gernetix.com
      MQTT_BROKER_URL: mqtt://mqtt-broker:1883
      INTERFACE_TELEMETRY_ENDPOINT: http://admin-tool:4600/api/internal/interface-calls
      INTERFACE_TELEMETRY_TOKEN: ${SYSTEM_EVENT_INGEST_TOKEN:?SYSTEM_EVENT_INGEST_TOKEN muss gesetzt sein}
      OTA_SIGNING_PRIVATE_KEY_PATH: /run/gernetix-pki/ota-signing-key.pem
      OTA_SIGNING_KEY_ID: ${OTA_SIGNING_KEY_ID:-ota-p256-2026-01}
    expose: ["4400"]
    ports:
      - "127.0.0.1:4400:4400"
    volumes:
      - build_state:/var/lib/gernetix/build
      - ${OTA_SIGNING_PRIVATE_KEY_PATH:-/etc/gernetix/pki/ota-signing-key.pem}:/run/gernetix-pki/ota-signing-key.pem:ro
    depends_on:
      runtime-postgres:
        condition: service_healthy
      runtime-postgres-migration:
        condition: service_completed_successfully
      mqtt-broker:
        condition: service_healthy

  build-router:
    image: nginx:1.28-alpine
    init: true
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    entrypoint: ["/opt/gernetix/build-router-entrypoint.sh"]
    environment:
      BUILD_WORKER_PRIMARY_UPSTREAMS: ${BUILD_WORKER_PRIMARY_UPSTREAMS:-}
      BUILD_WORKER_UPSTREAMS: ${BUILD_WORKER_UPSTREAMS:-}
    expose: ["4400"]
    ports:
      - "127.0.0.1:${BUILD_ROUTER_REMOTE_DEV_PORT:-14400}:4400"
    networks:
      - backend
      - worker-access
    volumes:
      - ./infra/vps/nginx/build-router.conf:/etc/nginx/build-router.conf:ro
      - ./infra/vps/nginx/build-router-entrypoint.sh:/opt/gernetix/build-router-entrypoint.sh:ro
    tmpfs:
      - /var/run/gernetix
      - /var/cache/nginx
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4400/router-health"]
      interval: 15s
      timeout: 4s
      retries: 5
      start_period: 5s
