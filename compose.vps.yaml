  mqtt-broker:
    image: eclipse-mosquitto:2.0
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - edge
      - backend
    ports:
      - "${PRIVATE_VPS_BIND_ADDRESS:-10.77.0.1}:${MQTT_TLS_PORT:-8883}:8883"
    expose: ["1883", "8883", "9001"]
    entrypoint: ["/mosquitto/config/docker-entrypoint.sh"]
    volumes:
      - ./infra/vps/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infra/vps/mosquitto/device.acl:/mosquitto/config/device.acl:ro
      - ./infra/vps/mosquitto/docker-entrypoint.sh:/mosquitto/config/docker-entrypoint.sh:ro
      - ${MQTT_LETSENCRYPT_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
      - ${DEVICE_CA_CERTIFICATE_PATH:-/etc/gernetix/pki/device-ca.pem}:/mosquitto/config/device-ca.pem:ro
      - mqtt_data:/mosquitto/data
      - mqtt_log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -p 1883 -t '$$SYS/broker/version' -C 1 -W 5 >/dev/null 2>&1"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 5s

  private-dns:
    image: coredns/coredns:1.14.6
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "${PRIVATE_VPS_BIND_ADDRESS:-10.77.0.1}:${PRIVATE_DNS_PORT:-53}:53/udp"
      - "${PRIVATE_VPS_BIND_ADDRESS:-10.77.0.1}:${PRIVATE_DNS_PORT:-53}:53/tcp"
    networks:
      - edge
    command: ["-conf", "/etc/coredns/Corefile"]
    volumes:
      - ./infra/vps/dns/Corefile:/etc/coredns/Corefile:ro

