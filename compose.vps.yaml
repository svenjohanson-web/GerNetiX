    image: nginx:1.28-alpine
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${PRIVATE_PLATFORM_TUNNEL_PORT:-8080}:8081"
