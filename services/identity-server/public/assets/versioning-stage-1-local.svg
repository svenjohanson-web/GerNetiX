<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Stufe eins: lokale Ordnerkopien</title><desc id="desc">Drei vollständige Projektordner liegen nebeneinander und werden manuell benannt.</desc><rect width="960" height="540" rx="28" fill="#071827"/><text x="54" y="62" fill="#67e8f9" font-family="system-ui,sans-serif" font-size="18" font-weight="800">STUFE 1 · MANUELLE KOPIEN</text><text x="54" y="105" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="31" font-weight="750">Jeder Ordner ist ein kompletter Stand</text><g font-family="system-ui,sans-serif"><g transform="translate(85 190)"><path d="M0 42h88l23-25h150q20 0 20 20v150q0 20-20 20H20q-20 0-20-20z" fill="#0e7490" stroke="#67e8f9" stroke-width="3"/><text x="140" y="112" text-anchor="middle" fill="white" font-size="22" font-weight="750">projekt_v1</text><text x="140" y="145" text-anchor="middle" fill="#cffafe" font-size="15">100 MB</text></g><g transform="translate(340 245)"><path d="M0 42h88l23-25h150q20 0 20 20v150q0 20-20 20H20q-20 0-20-20z" fill="#0369a1" stroke="#7dd3fc" stroke-width="3"/><text x="140" y="112" text-anchor="middle" fill="white" font-size="22" font-weight="750">projekt_v2</text><text x="140" y="145" text-anchor="middle" fill="#dbeafe" font-size="15">100 MB</text></g><g transform="translate(595 190)"><path d="M0 42h88l23-25h150q20 0 20 20v150q0 20-20 20H20q-20 0-20-20z" fill="#7c3aed" stroke="#c4b5fd" stroke-width="3"/><text x="140" y="102" text-anchor="middle" fill="white" font-size="20" font-weight="750">projekt_final</text><text x="140" y="130" text-anchor="middle" fill="white" font-size="20" font-weight="750">_wirklich</text><text x="140" y="160" text-anchor="middle" fill="#ede9fe" font-size="15">100 MB</text></g></g><text x="480" y="492" text-anchor="middle" fill="#fbbf24" font-family="system-ui,sans-serif" font-size="18" font-weight="700">3 Stände = 3 Vollkopien · Begründung und Autor fehlen</text></svg>
