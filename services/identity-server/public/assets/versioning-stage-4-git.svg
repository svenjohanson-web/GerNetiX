<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Stufe vier: Git</title><desc id="desc">Drei vollständige Git-Repositories tauschen Commits aus; Branches verweisen auf eine Commit-Historie.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#67e8f9"/></marker></defs><rect width="960" height="540" rx="28" fill="#071827"/><text x="54" y="62" fill="#67e8f9" font-family="system-ui,sans-serif" font-size="18" font-weight="800">STUFE 4 · GIT</text><text x="54" y="105" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="31" font-weight="750">Verteilte Historie – Arbeiten auch ohne Server</text><g font-family="system-ui,sans-serif"><g fill="#102b3d" stroke="#38bdf8" stroke-width="3"><rect x="65" y="175" width="230" height="210" rx="22"/><rect x="365" y="145" width="230" height="210" rx="22"/><rect x="665" y="175" width="230" height="210" rx="22"/></g><text x="180" y="211" text-anchor="middle" fill="#cffafe" font-size="18" font-weight="800">CLONE A</text><text x="480" y="181" text-anchor="middle" fill="#cffafe" font-size="18" font-weight="800">REMOTE / BARE</text><text x="780" y="211" text-anchor="middle" fill="#cffafe" font-size="18" font-weight="800">CLONE B</text><g stroke="#67e8f9" stroke-width="4" fill="#071827"><circle cx="115" cy="285" r="13"/><circle cx="180" cy="285" r="13"/><circle cx="245" cy="285" r="13"/><circle cx="415" cy="255" r="13"/><circle cx="480" cy="255" r="13"/><circle cx="545" cy="255" r="13"/><circle cx="715" cy="285" r="13"/><circle cx="780" cy="285" r="13"/><circle cx="845" cy="285" r="13"/></g><g stroke="#67e8f9" stroke-width="4"><path d="M128 285h39M193 285h39M428 255h39M493 255h39M728 285h39M793 285h39"/></g><g fill="#94a3b8" font-size="14"><text x="180" y="340" text-anchor="middle">Objekte + Historie</text><text x="480" y="310" text-anchor="middle">Objekte + Historie</text><text x="780" y="340" text-anchor="middle">Objekte + Historie</text></g></g><path d="M298 230h60" stroke="#67e8f9" stroke-width="4" marker-end="url(#a)"/><path d="M358 270h-60" stroke="#67e8f9" stroke-width="4" marker-end="url(#a)"/><path d="M598 230h60" stroke="#67e8f9" stroke-width="4" marker-end="url(#a)"/><path d="M658 270h-60" stroke="#67e8f9" stroke-width="4" marker-end="url(#a)"/><text x="330" y="215" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="13">push</text><text x="330" y="295" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="13">fetch</text><text x="630" y="215" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="13">fetch</text><text x="630" y="295" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="13">push</text><text x="480" y="455" text-anchor="middle" fill="#fbbf24" font-family="system-ui,sans-serif" font-size="17" font-weight="700">Der Remote-Server koordiniert – er ist nicht die einzige Kopie der Git-Historie.</text></svg>
