<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Git-Objektmodell</title><desc id="desc">Zwei Commits verweisen auf Trees; unveränderte Blobs werden wiederverwendet, ein geänderter Blob wird neu gespeichert.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9z" fill="#67e8f9"/></marker></defs><rect width="960" height="540" rx="28" fill="#071827"/><text x="52" y="60" fill="#67e8f9" font-family="system-ui,sans-serif" font-size="18" font-weight="800">GIT · LOGISCHER SNAPSHOT, PHYSISCHE WIEDERVERWENDUNG</text><g font-family="system-ui,sans-serif"><g><rect x="60" y="145" width="190" height="98" rx="18" fill="#7c3aed" stroke="#c4b5fd" stroke-width="3"/><text x="155" y="185" text-anchor="middle" fill="white" font-size="20" font-weight="800">Commit A</text><text x="155" y="216" text-anchor="middle" fill="#ede9fe" font-size="14">Eltern + Metadaten</text><rect x="60" y="315" width="190" height="98" rx="18" fill="#7c3aed" stroke="#c4b5fd" stroke-width="3"/><text x="155" y="355" text-anchor="middle" fill="white" font-size="20" font-weight="800">Commit B</text><text x="155" y="386" text-anchor="middle" fill="#ede9fe" font-size="14">neuer Snapshot</text></g><g><rect x="350" y="145" width="170" height="98" rx="18" fill="#0369a1" stroke="#7dd3fc" stroke-width="3"/><text x="435" y="185" text-anchor="middle" fill="white" font-size="20" font-weight="800">Tree A</text><text x="435" y="216" text-anchor="middle" fill="#dbeafe" font-size="14">Dateinamen → Objekte</text><rect x="350" y="315" width="170" height="98" rx="18" fill="#0369a1" stroke="#7dd3fc" stroke-width="3"/><text x="435" y="355" text-anchor="middle" fill="white" font-size="20" font-weight="800">Tree B</text><text x="435" y="386" text-anchor="middle" fill="#dbeafe" font-size="14">ein Eintrag geändert</text></g><g><rect x="650" y="105" width="220" height="82" rx="16" fill="#0e7490" stroke="#67e8f9" stroke-width="3"/><text x="760" y="140" text-anchor="middle" fill="white" font-size="19" font-weight="800">Blob X</text><text x="760" y="166" text-anchor="middle" fill="#cffafe" font-size="14">unverändert · einmal gespeichert</text><rect x="650" y="229" width="220" height="82" rx="16" fill="#0e7490" stroke="#67e8f9" stroke-width="3"/><text x="760" y="264" text-anchor="middle" fill="white" font-size="19" font-weight="800">Blob Y</text><text x="760" y="290" text-anchor="middle" fill="#cffafe" font-size="14">alter Dateiinhalt</text><rect x="650" y="353" width="220" height="82" rx="16" fill="#b45309" stroke="#fbbf24" stroke-width="3"/><text x="760" y="388" text-anchor="middle" fill="white" font-size="19" font-weight="800">Blob Z</text><text x="760" y="414" text-anchor="middle" fill="#fef3c7" font-size="14">neuer Dateiinhalt</text></g></g><g stroke="#67e8f9" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M252 194h90"/><path d="M252 364h90"/><path d="M522 180C585 180 590 146 642 146"/><path d="M522 213C585 213 590 270 642 270"/><path d="M522 350C585 350 590 146 642 146"/><path d="M522 382C585 382 590 394 642 394"/></g><text x="480" y="492" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="16">Gleicher Inhalt hat denselben Objekt-Hash. Packfiles können Objekte zusätzlich komprimieren und als Deltas speichern.</text></svg>
