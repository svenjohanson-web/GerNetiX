<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Strom erzeugt ein Magnetfeld</title>
  <desc id="desc">Links zeigt ein gerader Kupferleiter mit einem eigenen Stromrichtungspfeil drei kreisförmige Magnetfeldlinien. Rechts zeigt eine Spule aus klar erkennbaren Wicklungsschleifen, wie sich der magnetische Fluss in einem weichmagnetischen Kern bündelt.</desc>
  <defs>
    <marker id="fieldArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L12 6L0 12Z" fill="#38bdf8"/>
    </marker>
    <marker id="currentArrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L14 7L0 14Z" fill="#f43f5e"/>
    </marker>
    <linearGradient id="coreFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#475569"/>
      <stop offset=".5" stop-color="#64748b"/>
      <stop offset="1" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <rect width="960" height="540" rx="24" fill="#0b1018"/>
  <line x1="480" y1="82" x2="480" y2="468" stroke="#334155" stroke-width="2"/>

  <text x="240" y="56" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" font-weight="750" fill="#f8fafc">Ein gerader Leiter</text>
  <text x="720" y="56" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" font-weight="750" fill="#f8fafc">Viele Windungen als Spule</text>

  <g aria-label="Gerader stromdurchflossener Leiter">
    <line x1="240" y1="162" x2="240" y2="398" stroke="#c66a19" stroke-width="16" stroke-linecap="round"/>
    <text x="240" y="432" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="650" fill="#fdba74">Kupferleiter</text>

    <g fill="none" stroke="#38bdf8" stroke-width="4">
      <ellipse cx="240" cy="280" rx="74" ry="30"/>
      <ellipse cx="240" cy="280" rx="124" ry="54"/>
      <ellipse cx="240" cy="280" rx="174" ry="82"/>
    </g>
    <g fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round">
      <path d="M294 260C306 266 313 273 314 281" marker-end="url(#fieldArrow)"/>
      <path d="M334 245C352 254 363 267 364 281" marker-end="url(#fieldArrow)"/>
      <path d="M371 223C397 237 413 258 414 281" marker-end="url(#fieldArrow)"/>
    </g>
    <path d="M240 365V190" fill="none" stroke="#f43f5e" stroke-width="5" stroke-linecap="round" marker-end="url(#currentArrow)"/>
    <text x="240" y="148" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#fda4af">Stromrichtung I</text>
    <rect x="81" y="94" width="163" height="37" rx="18.5" fill="#10253a" stroke="#164e63"/>
    <circle cx="101" cy="112.5" r="5" fill="#38bdf8"/>
    <text x="115" y="118" font-family="system-ui,sans-serif" font-size="14" font-weight="650" fill="#bae6fd">Magnetfeld B</text>
  </g>

  <g aria-label="Spule mit weichmagnetischem Kern">
    <rect x="615" y="225" width="226" height="104" rx="19" fill="url(#coreFill)" stroke="#94a3b8" stroke-width="3"/>

    <g fill="none" stroke="#c66a19" stroke-width="8">
      <ellipse cx="638" cy="277" rx="13" ry="78"/>
      <ellipse cx="669" cy="277" rx="13" ry="78"/>
      <ellipse cx="700" cy="277" rx="13" ry="78"/>
      <ellipse cx="731" cy="277" rx="13" ry="78"/>
      <ellipse cx="762" cy="277" rx="13" ry="78"/>
      <ellipse cx="793" cy="277" rx="13" ry="78"/>
      <ellipse cx="824" cy="277" rx="13" ry="78"/>
    </g>

    <g fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" marker-end="url(#fieldArrow)">
      <path d="M646 251H805"/>
      <path d="M646 277H805"/>
      <path d="M646 303H805"/>
    </g>

    <rect x="676" y="239" width="99" height="76" rx="12" fill="#0f172a" stroke="#7dd3fc" stroke-width="2"/>
    <text x="725.5" y="270" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="800" fill="#f8fafc">Kern</text>
    <text x="725.5" y="293" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#bae6fd">z. B. Ferrit</text>

    <path d="M584 177H638V196" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <text x="584" y="167" text-anchor="start" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#fdba74">Kupferwicklung</text>

    <path d="M725 355V333" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <text x="725" y="379" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#bae6fd">Gebündeltes Magnetfeld B</text>
  </g>

  <text x="240" y="486" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#cbd5e1">Das Magnetfeld verläuft kreisförmig um den Leiter.</text>
  <text x="720" y="486" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#cbd5e1">Die Windungen verstärken sich; der Kern führt den Fluss.</text>
</svg>
