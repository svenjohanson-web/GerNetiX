<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Strom erzeugt ein Magnetfeld</title>
  <desc id="desc">Links entstehen kreisförmige Magnetfeldlinien um einen stromdurchflossenen Draht. Rechts verstärkt eine Drahtspule mit Eisenkern das Magnetfeld.</desc>
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#2563eb"/></marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#dc2626"/></marker>
  </defs>
  <rect width="960" height="540" rx="24" fill="#f8fafc"/>
  <text x="240" y="54" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#0f172a">Ein gerader Draht</text>
  <text x="720" y="54" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#0f172a">Viele Windungen als Spule</text>
  <line x1="240" y1="435" x2="240" y2="112" stroke="#dc2626" stroke-width="18" stroke-linecap="round"/>
  <line x1="240" y1="382" x2="240" y2="140" stroke="#fff" stroke-width="3" marker-end="url(#arrowRed)"/>
  <text x="270" y="294" font-family="system-ui,sans-serif" font-size="21" fill="#991b1b">Strom I</text>
  <g fill="none" stroke="#2563eb" stroke-width="5">
    <ellipse cx="240" cy="278" rx="78" ry="30"/>
    <ellipse cx="240" cy="278" rx="132" ry="55"/>
    <ellipse cx="240" cy="278" rx="183" ry="82"/>
  </g>
  <path d="M168 267C185 252 207 246 226 247" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <path d="M119 262C145 235 184 220 218 220" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <text x="240" y="488" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#334155">Magnetfeld: kreisförmig um den Draht</text>
  <line x1="480" y1="80" x2="480" y2="478" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="628" y="220" width="190" height="82" rx="18" fill="#64748b"/>
  <text x="723" y="270" text-anchor="middle" font-family="system-ui,sans-serif" font-size="21" font-weight="700" fill="#fff">Eisenkern</text>
