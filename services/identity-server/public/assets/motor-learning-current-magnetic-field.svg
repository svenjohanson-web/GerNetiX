    <path d="M672 198v126"/>
    <path d="M700 198v126"/>
    <path d="M728 198v126"/>
    <path d="M756 198v126"/>
    <path d="M784 198v126"/>
    <path d="M812 198v126"/>
  </g>
  <path d="M644 198C605 198 585 171 585 145V118" fill="none" stroke="#dc2626" stroke-width="8"/>
  <path d="M812 324C851 324 870 351 870 380V421" fill="none" stroke="#2563eb" stroke-width="8"/>
  <g fill="none" stroke="#2563eb" stroke-width="5">
    <path d="M628 227C552 153 556 102 723 94C890 102 894 153 818 227" marker-end="url(#arrowBlue)"/>
    <path d="M818 295C894 369 890 420 723 428C556 420 552 369 628 295" marker-end="url(#arrowBlue)"/>
