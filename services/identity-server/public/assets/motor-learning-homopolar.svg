<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Homopolarmotor als Sonderexperiment</title>
  <desc id="desc">Eine Batterie steht auf einem Scheibenmagneten. Ein gebogener Kupferdraht berührt oben den Batteriepol und unten den Magnetrand. Strom und Magnetfeld erzeugen eine tangentiale Kraft.</desc>
