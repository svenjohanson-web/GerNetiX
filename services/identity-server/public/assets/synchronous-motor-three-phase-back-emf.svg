<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="title desc">
  <title id="title">Drei Phasen erzeugen Drehmoment, Kurzschluss bremst</title>
  <desc id="desc">Die obere Hälfte zeigt drei geregelte Phasenströme, deren Felder sich zu einem Drehfeld überlagern und den Rotor antreiben. Die untere Hälfte zeigt den anderen Fall: Ein drehender Permanentmagnet erzeugt Gegen-EMK. Sind die Statorphasen kurzgeschlossen, treibt diese Spannung Strom und ein Bremsmoment entgegen der Drehung.</desc>
  <defs>
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#22d3ee"/></marker>
    <marker id="arrowViolet" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#a78bfa"/></marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#fbbf24"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#4ade80"/></marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#fb7185"/></marker>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#020617" flood-opacity=".8"/></filter>
  </defs>

  <rect width="720" height="720" rx="24" fill="#0b1018"/>
  <text x="38" y="43" font-family="system-ui,sans-serif" font-size="17" font-weight="850" fill="#67e8f9">ANTRIEB · GEREGELTE DREI PHASEN</text>
  <text x="38" y="72" font-family="system-ui,sans-serif" font-size="24" font-weight="900" fill="#f8fafc">Die Felder überlagern sich zu einem Drehfeld</text>

  <!-- Drei Phasenachsen im Stator: ihre momentanen Feldanteile addieren sich zum resultierenden Feld BΣ. -->
  <g transform="translate(246 205)" filter="url(#shadow)">
    <circle r="126" fill="#1e293b" stroke="#64748b" stroke-width="4"/>
    <circle r="79" fill="#0b1018" stroke="#94a3b8" stroke-width="3"/>
    <g fill="#155e75" stroke="#22d3ee" stroke-width="2"><rect x="88" y="-20" width="35" height="40" rx="8"/><rect x="-123" y="-20" width="35" height="40" rx="8"/></g>
    <g fill="#4c1d95" stroke="#a78bfa" stroke-width="2"><rect x="88" y="-20" width="35" height="40" rx="8" transform="rotate(120)"/><rect x="-123" y="-20" width="35" height="40" rx="8" transform="rotate(120)"/></g>
    <g fill="#78350f" stroke="#fbbf24" stroke-width="2"><rect x="88" y="-20" width="35" height="40" rx="8" transform="rotate(240)"/><rect x="-123" y="-20" width="35" height="40" rx="8" transform="rotate(240)"/></g>
    <path d="M-59 0H50" fill="none" stroke="#22d3ee" stroke-width="5" marker-end="url(#arrowCyan)" opacity=".8"/>
    <path d="M30 51L-25 -43" fill="none" stroke="#a78bfa" stroke-width="5" marker-end="url(#arrowViolet)" opacity=".8"/>
    <path d="M28 -51L-26 43" fill="none" stroke="#fbbf24" stroke-width="5" marker-end="url(#arrowAmber)" opacity=".8"/>
    <path d="M-45 31L61 -42" fill="none" stroke="#4ade80" stroke-width="8" marker-end="url(#arrowGreen)"/>
    <text x="66" y="-48" font-family="system-ui,sans-serif" font-size="15" font-weight="900" fill="#86efac">BΣ</text>
    <g transform="rotate(-34)"><rect x="-42" y="-20" width="84" height="40" rx="19" fill="#dc2626"/><path d="M0 -20H42V20H0Z" fill="#2563eb"/><text x="-20" y="7" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="900" fill="#fff">N</text><text x="21" y="7" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="900" fill="#fff">S</text></g>
    <path d="M-53 -70A89 89 0 0 1 64 -51" fill="none" stroke="#c084fc" stroke-width="5" marker-end="url(#arrowViolet)"/>
  </g>
  <g font-family="system-ui,sans-serif" font-size="15" font-weight="850">
    <text x="418" y="149" fill="#67e8f9">iA</text><text x="418" y="173" fill="#c4b5fd">iB</text><text x="418" y="197" fill="#fde68a">iC</text>
    <text x="418" y="230" fill="#e2e8f0">geregelt und zeitversetzt</text>
    <text x="418" y="252" fill="#e2e8f0">→ nutzbares, gleichmäßigeres</text><text x="418" y="274" fill="#e2e8f0">Drehmoment am Rotor</text>
    <text x="38" y="342" fill="#94a3b8">Die drei Phasenachsen sind nicht drei „kurzgeschlossene Polpaare“.</text>
  </g>

  <path d="M36 372H684" stroke="#334155" stroke-width="2"/>
  <text x="38" y="407" font-family="system-ui,sans-serif" font-size="17" font-weight="850" fill="#fda4af">SONDERFALL · KURZSCHLUSSBREMSUNG</text>
  <text x="38" y="436" font-family="system-ui,sans-serif" font-size="24" font-weight="900" fill="#f8fafc">Gegen-EMK ist Spannung – nicht Antriebsmoment</text>

  <!-- Ursache-Wirkung-Kette der Kurzschlussbremsung. -->
  <g font-family="system-ui,sans-serif" text-anchor="middle" filter="url(#shadow)">
    <circle cx="142" cy="545" r="62" fill="#1e293b" stroke="#64748b" stroke-width="3"/>
    <rect x="102" y="525" width="80" height="40" rx="18" fill="#dc2626"/><path d="M142 525H182V565H142Z" fill="#2563eb"/>
    <path d="M91 503A65 65 0 0 1 183 492" fill="none" stroke="#fbbf24" stroke-width="5" marker-end="url(#arrowAmber)"/>
    <text x="142" y="626" font-size="14" font-weight="850" fill="#fde68a">Rotor dreht: ω</text>

    <path d="M218 545H284" fill="none" stroke="#fbbf24" stroke-width="5" marker-end="url(#arrowAmber)"/>
    <rect x="286" y="495" width="142" height="100" rx="15" fill="#172554" stroke="#818cf8" stroke-width="3"/>
    <path d="M313 519C331 505 349 533 367 519S403 533 403 519" fill="none" stroke="#a78bfa" stroke-width="6"/>
    <text x="357" y="553" font-size="15" font-weight="900" fill="#e9d5ff">Gegen-EMK e</text>
    <text x="357" y="576" font-size="12" font-weight="750" fill="#c4b5fd">induzierte Spannung</text>

    <path d="M432 545H486" fill="none" stroke="#fb7185" stroke-width="5" marker-end="url(#arrowRed)"/>
    <rect x="490" y="495" width="111" height="100" rx="15" fill="#3f0c16" stroke="#fb7185" stroke-width="3"/>
    <path d="M518 520V571M552 520V571M586 520V571M518 571H586" fill="none" stroke="#fecdd3" stroke-width="5" stroke-linecap="round"/>
    <text x="546" y="615" font-size="13" font-weight="900" fill="#fecdd3">Kurzschlussstrom Iₖ</text>

    <path d="M603 545H657" fill="none" stroke="#fb7185" stroke-width="5" marker-end="url(#arrowRed)"/>
    <path d="M629 501A55 55 0 0 0 629 589" fill="none" stroke="#fb7185" stroke-width="6" marker-end="url(#arrowRed)"/>
    <text x="657" y="615" font-size="13" font-weight="900" fill="#fecdd3">M Bremse</text>
    <text x="657" y="635" font-size="12" font-weight="750" fill="#fda4af">gegen ω</text>
  </g>
  <text x="360" y="690" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="750" fill="#cbd5e1">Mechanische Bewegungsenergie wird über Strom in Wärme umgewandelt. Bei Stillstand ist die Gegen-EMK praktisch null.</text>
</svg>
