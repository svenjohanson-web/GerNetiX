<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Rotorlage schaltet eine Spule über Sensor und Transistor</title>
  <desc id="desc">Ein Hall-Sensor erkennt den Rotor, gibt ein kleines Signal an einen Transistor und dieser schaltet den größeren Strom durch die feststehende Spule.</desc>
  <defs>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#dc2626"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#2563eb"/></marker>
  </defs>
  <rect width="960" height="540" rx="24" fill="#f8fafc"/>
  <circle cx="215" cy="260" r="118" fill="#e2e8f0" stroke="#64748b" stroke-width="5"/>
  <g transform="rotate(-25 215 260)">
    <rect x="137" y="230" width="156" height="60" rx="16" fill="#dc2626"/>
    <rect x="215" y="230" width="78" height="60" rx="16" fill="#2563eb"/>
    <text x="176" y="270" text-anchor="middle" font-family="system-ui,sans-serif" font-size="23" font-weight="800" fill="#fff">N</text>
    <text x="254" y="270" text-anchor="middle" font-family="system-ui,sans-serif" font-size="23" font-weight="800" fill="#fff">S</text>
  </g>
  <text x="215" y="420" text-anchor="middle" font-family="system-ui,sans-serif" font-size="21" font-weight="700" fill="#0f172a">Rotor mit Magnet</text>
  <rect x="365" y="195" width="106" height="64" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
  <text x="418" y="234" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#1e3a8a">Hall-Sensor</text>
  <line x1="470" y1="227" x2="570" y2="227" stroke="#2563eb" stroke-width="6" stroke-dasharray="10 8" marker-end="url(#arrowBlue)"/>
  <text x="520" y="205" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#1e40af">kleines Signal</text>
  <rect x="580" y="178" width="124" height="98" rx="15" fill="#e2e8f0" stroke="#334155" stroke-width="4"/>
  <text x="642" y="218" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#0f172a">Transistor</text>
  <text x="642" y="249" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#475569">Leistungsschalter</text>
  <rect x="780" y="148" width="46" height="160" rx="12" fill="#64748b"/>
  <g stroke="#b45309" stroke-width="9"><line x1="773" y1="160" x2="833" y2="160"/><line x1="773" y1="185" x2="833" y2="185"/><line x1="773" y1="210" x2="833" y2="210"/><line x1="773" y1="235" x2="833" y2="235"/><line x1="773" y1="260" x2="833" y2="260"/><line x1="773" y1="285" x2="833" y2="285"/></g>
  <text x="803" y="345" text-anchor="middle" font-family="system-ui,sans-serif" font-size="21" font-weight="700" fill="#0f172a">Spule</text>
  <path d="M642 178V102H803V147" fill="none" stroke="#dc2626" stroke-width="7" marker-end="url(#arrowRed)"/>
  <path d="M803 308V390H772" fill="none" stroke="#dc2626" stroke-width="7"/>
  <rect x="667" y="369" width="105" height="42" rx="10" fill="#fff" stroke="#dc2626" stroke-width="4"/>
  <text x="719" y="396" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#991b1b">Versorgung</text>
  <path d="M667 390H642V276" fill="none" stroke="#dc2626" stroke-width="7" marker-end="url(#arrowRed)"/>
  <text x="730" y="82" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#991b1b">geschalteter Spulenstrom</text>
  <text x="480" y="492" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" fill="#334155">Der Sensor misst nur die Rotorlage. Der Transistor übernimmt den größeren Spulenstrom.</text>
</svg>
