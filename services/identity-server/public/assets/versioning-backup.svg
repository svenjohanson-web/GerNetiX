<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Versionsverwaltung und 3-2-1-Backup</title><desc id="desc">Arbeitskopie, Versionsserver und getrennte unveränderliche Sicherung bilden drei Schutzebenen; ein Restore-Test führt zurück in einen prüfbaren Zustand.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#67e8f9"/></marker></defs><rect width="960" height="540" rx="28" fill="#071827"/><text x="52" y="60" fill="#67e8f9" font-family="system-ui,sans-serif" font-size="18" font-weight="800">3–2–1 · BACKUP UND RESTORE</text><text x="52" y="101" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="29" font-weight="750">Drei Ebenen mit unterschiedlichen Aufgaben</text><g font-family="system-ui,sans-serif"><g><rect x="55" y="165" width="245" height="195" rx="22" fill="#172554" stroke="#818cf8" stroke-width="3"/><text x="178" y="205" text-anchor="middle" fill="#c4b5fd" font-size="16" font-weight="800">1 · ARBEITSKOPIE</text><rect x="105" y="237" width="145" height="85" rx="12" fill="#0f172a" stroke="#c4b5fd" stroke-width="3"/><text x="178" y="273" text-anchor="middle" fill="white" font-size="18" font-weight="750">Laptop / PC</text><text x="178" y="300" text-anchor="middle" fill="#94a3b8" font-size="13">aktuelle Arbeit</text></g><g><rect x="358" y="165" width="245" height="195" rx="22" fill="#102b3d" stroke="#38bdf8" stroke-width="3"/><text x="480" y="205" text-anchor="middle" fill="#67e8f9" font-size="16" font-weight="800">2 · VERSIONSYSTEM</text><ellipse cx="480" cy="250" rx="78" ry="22" fill="#0e7490"/><path d="M402 250v55c0 12 35 22 78 22s78-10 78-22v-55" fill="#0e7490" stroke="#67e8f9" stroke-width="3"/><text x="480" y="290" text-anchor="middle" fill="white" font-size="18" font-weight="750">Historie</text><text x="480" y="345" text-anchor="middle" fill="#94a3b8" font-size="13">Commits · Autoren · Stände</text></g><g