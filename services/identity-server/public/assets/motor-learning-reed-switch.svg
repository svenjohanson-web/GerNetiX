<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Motorversuch mit Reedkontakt</title>
  <desc id="desc">Ein Permanentmagnet dreht als Rotor. Nähert er sich dem Reedkontakt, schließt dieser den Stromkreis der feststehenden Spule. Nach dem Vorbeilaufen öffnet der Kontakt wieder.</desc>
  <defs>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#16a34a"/></marker>
  </defs>
  <rect width="960" height="540" rx="24" fill="#f8fafc"/>
  <text x="250" y="48" text-anchor="middle" font-family="system-ui,sans-serif" font-size="23" font-weight="700" fill="#0f172a">1 · Magnet nähert sich</text>
  <text x="710" y="48" text-anchor="middle" font-family="system-ui,sans-serif" font-size="23" font-weight="700" fill="#0f172a">2 · Spule gibt einen Schubs</text>
  <line x1="480" y1="76" x2="480" y2="486" stroke="#cbd5e1" stroke-width="2"/>
  <g transform="translate(0 0)">
    <circle cx="245" cy="266" r="112" fill="#e2e8f0" stroke="#64748b" stroke-width="5"/>
    <g transform="rotate(-35 245 266)">
      <rect x="172" y="238" width="146" height="56" rx="15" fill="#dc2626"/>
      <rect x="245" y="238" width="73" height="56" rx="15" fill="#2563eb"/>
      <text x="207" y="275" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="800" fill="#fff">N</text>
      <text x="282" y="275" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="800" fill="#fff">S</text>
    </g>
    <rect x="354" y="185" width="45" height="162" rx="12" fill="#64748b"/>
    <g stroke="#b45309" stroke-width="9"><line x1="347" y1="197" x2="406" y2="197"/><line x1="347" y1="222" x2="406" y2="222"/><line x1="347" y1="247" x2="406" y2="247"/><line x1="347" y1="272" x2="406" y2="272"/><line x1="347" y1="297" x2="406" y2="297"/><line x1="347" y1="322" x2="406" y2="322"/></g>
    <rect x="320" y="385" width="88" height="30" rx="15" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
    <line x1="338" y1="400" x2="360" y2="400" stroke="#334155" stroke-width="4"/>
    <line x1="368" y1="392" x2="391" y2="400" stroke="#16a34a" stroke-width="5"/>
    <text x="364" y="446" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#334155">Reedkontakt schließt</text>
  </g>
  <g transform="translate(460 0)">
    <circle cx="245" cy="266" r="112" fill="#e2e8f0" stroke="#64748b" stroke-width="5"/>
    <g transform="rotate(18 245 266)">
      <rect x="172" y="238" width="146" height="56" rx="15" fill="#dc2626"/>
      <rect x="245" y="238" width="73" height="56" rx="15" fill="#2563eb"/>
      <text x="207" y="275" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="800" fill="#fff">N</text>
      <text x="282" y="275" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="800" fill="#fff">S</text>
    </g>
    <rect x="354" y="185" width="45" height="162" rx="12" fill="#64748b"/>
    <g stroke="#b45309" stroke-width="9"><line x1="347" y1="197" x2="406" y2="197"/><line x1="347" y1="222" x2="406" y2="222"/><line x1="347" y1="247" x2="406" y2="247"/><line x1="347" y1="272" x2="406" y2="272"/><line x1="347" y1="297" x2="406" y2="297"/><line x1="347" y1="322" x2="406" y2="322"/></g>
    <path d="M125 380A145 145 0 0 0 346 356" fill="none" stroke="#16a34a" stroke-width="8" marker-end="url(#arrowGreen)"/>
    <text x="250" y="446" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#334155">Rotor läuft über den Schaltpunkt hinaus</text>
  </g>
  <text x="480" y="512" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" fill="#334155">Die Spule steht fest. Der Rotor trägt nur den Permanentmagneten.</text>
</svg>
