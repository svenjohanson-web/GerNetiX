<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Stufe drei: Subversion</title><desc id="desc">Ein zentrales Subversion-Repository speichert atomare Commits als repositoryweite Revisionen.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#67e8f9"/></marker></defs><rect width="960" height="540" rx="28" fill="#071827"/><text x="54" y="62" fill="#67e8f9" font-family="system-ui,sans-serif" font-size="18" font-weight="800">STUFE 3 · SUBVERSION</text><text x="54" y="105" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="31" font-weight="750">Ein Commit – eine atomare Repository-Revision</text><g font-family="system-ui,sans-serif"><rect x="285" y="150" width="390" height="290" rx="24" fill="#102b3d" stroke="#38bdf8" stroke-width="3"/><text x="480" y="185" text-anchor="middle" fill="#cffafe" font-size="18" font-weight="800">ZENTRALES SVN-REPOSITORY</text><g><rect x="330" y="215" width="300" height="52" rx="12" fill="#0e7490"/><text x="350" y="247" fill="white" font-size="17" font-weight="750">r41</text><text x="410" y="247" fill="#cffafe" font-size="15">main.c + ui.c + Test</text><rect x="330" y="284" width="300" height="52" rx="12" fill="#0369a1"/><text x="350" y="316" fill="white" font-size="17" font-weight="750">r42</text><text x="410" y="316" fill="#dbeafe" font-size="15">Branch als günstige Kopie</text><rect x="330" y="353" width="300" height="52" rx="12" fill="#7c3aed"/><text x="350" y="385" fill="white" font-size="17" font-weight="750">r43</text><text x="410" y="385" fill="#ede9fe" font-size="15">Release-Tag</text></g><rect x="60" y="220" width="165" height="105" rx="17" fill="#172554" stroke="#818cf8" stroke-width="3"/><text x="142" y="265" text-anchor="middle" fill="white" font-size="19" font-weight="750">Working Copy</text><text x="142" y="294" text-anchor="middle" fill="#c4b5fd" font-size="14">Client</text></g><path d="M226 252h52" stroke="#67e8f9" stroke-width="4" marker-end="url(#a)"/><path d="M278 292h-52" stroke="#67e8f9" stroke-width="4" marker-end="url(#a)"/><text x="742" y="235" fill="#67e8f9" font-family="system-ui,sans-serif" font-size="17" font-weight="750">Atomar</text><text x="742" y="267" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="15">alles oder nichts</text><text x="742" y="322" fill="#67e8f9" font-family="system-ui,sans-serif" font-size="17" font-weight="750">Zentral</text><text x="742" y="354" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="15">Server ist Wahrheit</text><text x="480" y="490" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="16">Repositoryweite Nummern machen einen zusammengehörigen Stand eindeutig benennbar.</text></svg>
