<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Projektversionen als Ordnerkopien</title><desc id="desc">Eine Festplatte enthält mehrere vollständige Projektordner mit uneindeutigen Namen.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071827"/><stop offset="1" stop-color="#102b3d"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".28"/></filter></defs>
  <rect width="960" height="540" rx="28" fill="url(#bg)"/><text x="52" y="58" fill="#67e8f9" font-family="system-ui,sans-serif" font-size="19" font-weight="800">VOLLSTÄNDE AUF EINER FESTPLATTE</text><text x="52" y="96" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="30" font-weight="750">Einfach zu öffnen – schwer eindeutig zu halten</text>
  <rect x="54" y="140" width="852" height="330" rx="24" fill="#0b1722" stroke="#155e75" stroke-width="3" filter="url(#shadow)"/><rect x="92" y="194" width="174" height="212" rx="18" fill="#172554" stroke="#38bdf8" stroke-width="3"/><circle cx="179" cy="300" r="42" fill="#0f172a" stroke="#67e8f9" stroke-width="8"/><circle cx="179" cy="300" r="10" fill="#67e8f9"/><text x="179" y="374" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="18" font-weight="700">Meine Festplatte</text>
  <g font-family="system-ui,sans-serif"><g transform="translate(322 180)"><path d="M0 38h70l18-22h98q18 0 18 18v86q0 18-18 18H18q-18 0-18-18z" fill="#0e7490"/><text x="102" y="83" text-anchor="middle" fill="white" font-size="18" font-weight="750">projekt</text><text x="102" y="108" text-anchor="middle" fill="#cffafe" font-size="13">vollständige Kopie</text></g><g transform="translate(618 180)"><path d="M0 38h70l18-22h98q18 0 18 18v86q0 18-18 18H18q-18 0-18-18z" fill="#0369a1"/><text x="102" y="83" text-anchor="middle" fill="white" font-size="18" font-weight="750">projekt_neu</text><text x="102" y="108" text-anchor="middle" fill="#dbeafe" font-size="13">vollständige Kopie</text></g><g transform="translate(470 332)"><path d="M0 38h70l18-22h98q18 0 18 18v86q0 18-18 18H18q-18 0-18-18z" fill="#7c3aed"/><text x="102" y="77" text-anchor="middle" fill="white" font-size="17" font-weight="750">projekt_final</text><text x="102" y="101" text-anchor="middle" fill="white" font-size="17" font-weight="750">_wirklich</text><text x="102" y="124" text-anchor="middle" fill="#ede9fe" font-size="13">welcher Stand gilt?</text></g></g>
  <path d="M268 297H318M526 248h86M572 330v-42" stroke="#67e8f9" stroke-width="4" stroke-dasharray="9 9"/><text x="480" y="500" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="16">Ohne zweite unabhängige Sicherung sind Arbeitsstand und Historie gemeinsam gefährdet.</text>
</svg>
