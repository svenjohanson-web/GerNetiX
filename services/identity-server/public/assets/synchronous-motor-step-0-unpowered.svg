<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="title desc">
  <title id="title">Synchronmotor im unbestromten Zustand</title>
  <desc id="desc">Sechs graue Statorpole bilden drei gegenüberliegende Spulenpaare der Phasen A, B und C. In der Mitte befindet sich ein frei drehbarer Dauermagnet-Rotor.</desc>
  <defs>
    <g id="pole"><rect x="538" y="322" width="94" height="76" rx="13"/></g>
    <marker id="turnArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#0f766e"/></marker>
  </defs>
  <rect width="720" height="720" rx="24" fill="#f8fafc"/>
  <text x="42" y="52" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="#0891b2">SCHRITT 1 · STROMLOS</text>
  <text x="42" y="86" font-family="system-ui,sans-serif" font-size="27" font-weight="850" fill="#0f172a">Der Rotor lässt sich drehen</text>

  <circle cx="360" cy="360" r="236" fill="#e2e8f0" stroke="#64748b" stroke-width="5"/>
  <circle cx="360" cy="360" r="168" fill="#fff" stroke="#94a3b8" stroke-width="3"/>
  <g fill="#cbd5e1" stroke="#64748b" stroke-width="3">
    <use href="#pole"/><use href="#pole" transform="rotate(60 360 360)"/>
    <use href="#pole" transform="rotate(120 360 360)"/><use href="#pole" transform="rotate(180 360 360)"/>
    <use href="#pole" transform="rotate(240 360 360)"/><use href="#pole" transform="rotate(300 360 360)"/>
  </g>
  <g font-family="system-ui,sans-serif" font-size="17" font-weight="850" text-anchor="middle">
    <text x="655" y="366" fill="#0891b2">A</text><text x="65" y="366" fill="#0891b2">A</text>
    <text x="500" y="112" fill="#7c3aed">B</text><text x="220" y="618" fill="#7c3aed">B</text>
    <text x="220" y="112" fill="#d97706">C</text><text x="500" y="618" fill="#d97706">C</text>
  </g>

  <g transform="rotate(28 360 360)">
    <rect x="280" y="326" width="80" height="68" rx="32" fill="#2563eb"/>
    <rect x="360" y="326" width="80" height="68" rx="32" fill="#dc2626"/>
    <text x="320" y="368" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" font-weight="900" fill="#fff">S</text>
    <text x="400" y="368" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" font-weight="900" fill="#fff">N</text>
  </g>
  <circle cx="360" cy="360" r="12" fill="#0f172a"/>
  <path d="M298 268 A118 118 0 0 1 449 284" fill="none" stroke="#0f766e" stroke-width="5" marker-end="url(#turnArrow)"/>
  <text x="360" y="646" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="750" fill="#0f766e">kein Statorfeld · Rotor im Lernmodell frei drehbar</text>
  <text x="360" y="688" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#475569">Drei Spulenpaare: Phase A, B und C · jeweils gegenüberliegend</text>
</svg>
