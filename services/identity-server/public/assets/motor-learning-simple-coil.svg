<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Einfacher Spulenmotor: vom Magnetfeld zum Drehmoment</title>
  <desc id="desc">Dreidimensionale Darstellung eines einfachen Spulenmotors. Ein zusammenhängender Stator mit Nordpol links und Südpol rechts erzeugt ein Magnetfeld durch den Luftspalt. Eine rechteckige Kupferspule mit Welle bildet den Rotor. Strom in ihren gegenüberliegenden Leiterseiten erzeugt zwei entgegengesetzte Kräfte, die gemeinsam die Welle drehen.</desc>
  <defs>
    <marker id="fieldArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#38bdf8"/></marker>
    <marker id="forceArrow" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L13 6.5L0 13Z" fill="#4ade80"/></marker>
    <marker id="torqueArrow" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L13 6.5L0 13Z" fill="#c084fc"/></marker>
    <filter id="labelShadow" x="-25%" y="-35%" width="150%" height="170%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#020617" flood-opacity=".9"/></filter>
  </defs>

  <image href="motor-learning-simple-coil-3d.png" x="0" y="0" width="960" height="540" preserveAspectRatio="xMidYMid slice"/>
  <rect x="0" y="0" width="960" height="77" fill="#020617" fill-opacity=".5"/>
  <text x="480" y="37" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" font-weight="850" fill="#f8fafc" filter="url(#labelShadow)">Ein Kräftepaar dreht die Spule</text>
  <text x="480" y="61" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="750" fill="#cbd5e1">3D-Schnittdarstellung eines einfachen Spulenmotors</text>

  <!-- 1. Das Statorfeld verläuft im Luftspalt vom N- zum S-Pol. -->
  <g font-family="system-ui,sans-serif" filter="url(#labelShadow)">
    <text x="320" y="270" text-anchor="middle" font-size="26" font-weight="900" fill="#fff1f2">N</text>
    <text x="682" y="275" text-anchor="middle" font-size="26" font-weight="900" fill="#ecfeff">S</text>
    <rect x="387" y="102" width="187" height="35" rx="17" fill="#082f49" fill-opacity=".94" stroke="#38bdf8"/>
    <text x="480" y="125" text-anchor="middle" font-size="15" font-weight="850" fill="#bae6fd">1 · Magnetfeld B</text>
  </g>
  <path d="M364 178H634" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" marker-end="url(#fieldArrow)"/>

  <!-- 2. Die Kupferspule ist mit der Welle der drehende Rotor. -->
  <g font-family="system-ui,sans-serif" filter="url(#labelShadow)">
    <rect x="86" y="370" width="219" height="38" rx="18" fill="#431407" fill-opacity=".94" stroke="#fb923c"/>
    <text x="195" y="395" text-anchor="middle" font-size="14" font-weight="850" fill="#fed7aa">2 · Strom I durch die Spule</text>
  </g>
  <path d="M305 387L368 327" fill="none" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>
  <path d="M397 260L358 226" fill="none" stroke="#4ade80" stroke-width="7" stroke-linecap="round" marker-end="url(#forceArrow)"/>
  <path d="M580 287L620 323" fill="none" stroke="#4ade80" stroke-width="7" stroke-linecap="round" marker-end="url(#forceArrow)"/>
  <text x="348" y="229" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="900" fill="#86efac" filter="url(#labelShadow)">F</text>
  <text x="632" y="337" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="900" fill="#86efac" filter="url(#labelShadow)">F</text>

  <!-- 3. Zwei entgegengesetzte Kräfte auf verschiedenen Seiten der Welle ergeben ein Drehmoment. -->
  <path d="M335 393A63 45 0 0 1 433 412" fill="none" stroke="#c084fc" stroke-width="7" stroke-linecap="round" marker-end="url(#torqueArrow)"/>
  <g font-family="system-ui,sans-serif" filter="url(#labelShadow)">
    <rect x="620" y="386" width="246" height="54" rx="16" fill="#3b0764" fill-opacity=".92" stroke="#c084fc"/>
    <text x="743" y="409" text-anchor="middle" font-size="15" font-weight="900" fill="#e9d5ff">3 · Kräftepaar → Drehmoment M</text>
    <text x="743" y="429" text-anchor="middle" font-size="12" font-weight="750" fill="#ddd6fe">Die Welle dreht sich um ihre Achse.</text>
  </g>
  <path d="M620 410L445 409" fill="none" stroke="#c084fc" stroke-width="3" stroke-linecap="round"/>
</svg>
