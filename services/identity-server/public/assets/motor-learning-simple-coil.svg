<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Einfacher Spulenmotor</title>
  <desc id="desc">Eine drehbar gelagerte Spule liegt radial zwischen festen Magnetpolen. Strom und Magnetfeld erzeugen auf den beiden Spulenseiten entgegengesetzte Kräfte und damit ein Drehmoment.</desc>
  <defs>
    <marker id="arrowTorque" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#16a34a"/></marker>
  </defs>
  <rect width="960" height="540" rx="24" fill="#f8fafc"/>
  <text x="480" y="48" text-anchor="middle" font-family="system-ui,sans-serif" font-size="25" font-weight="700" fill="#0f172a">Querschnitt: feste Magnete, drehbare Spule</text>
  <path d="M100 152Q100 96 156 96H280V444H156Q100 444 100 388Z" fill="#dc2626"/>
  <path d="M860 152Q860 96 804 96H680V444H804Q860 444 860 388Z" fill="#2563eb"/>
  <text x="190" y="286" text-anchor="middle" font-family="system-ui,sans-serif" font-size="52" font-weight="800" fill="#fff">N</text>
  <text x="770" y="286" text-anchor="middle" font-family="system-ui,sans-serif" font-size="52" font-weight="800" fill="#fff">S</text>
  <circle cx="480" cy="270" r="137" fill="#e2e8f0" stroke="#64748b" stroke-width="5"/>
  <rect x="395" y="166" width="170" height="208" rx="18" fill="none" stroke="#b45309" stroke-width="20"/>
  <circle cx="414" cy="270" r="28" fill="#fff" stroke="#b45309" stroke-width="8"/>
  <circle cx="414" cy="270" r="9" fill="#b45309"/>
  <circle cx="546" cy="270" r="28" fill="#fff" stroke="#b45309" stroke-width="8"/>
  <path d="M531 255l30 30m0-30l-30 30" stroke="#b45309" stroke-width="8" stroke-linecap="round"/>
  <text x="414" y="316" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#92400e">Strom heraus</text>
  <text x="546" y="316" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#92400e">Strom hinein</text>
  <line x1="414" y1="232" x2="414" y2="132" stroke="#16a34a" stroke-width="9" marker-end="url(#arrowTorque)"/>
  <line x1="546" y1="308" x2="546" y2="408" stroke="#16a34a" stroke-width="9" marker-end="url(#arrowTorque)"/>
  <path d="M608 184C655 224 655 316 608 356" fill="none" stroke="#16a34a" stroke-width="8" marker-end="url(#arrowTorque)"/>
  <text x="480" y="474" text-anchor="middle" font-family="system-ui,sans-serif" font-size="21" fill="#334155">Die beiden Kräfte bilden gemeinsam ein Drehmoment.</text>
  <text x="480" y="510" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#64748b">Die halb abisolierten Achsenden schalten den Strom nur in der günstigen Hälfte der Umdrehung ein.</text>
</svg>
