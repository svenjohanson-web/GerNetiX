project:
  id: waveshare-voice-lab
  name: Nexi Basic (Waveshare Voice Lab)
  board_profile_id: hardware.processor_board.waveshare_esp32_s3_audio_board
  purpose: local_voice_assistant_reference

product:
  id: nexi-basic
  name: Nexi Basic
  stage: local_reference
  derived_from: waveshare_voice_lab
  cloud_ai: disabled

firmware:
  basis: gernetix-runtime-basissoftware
  profile: full
  build_environment: waveshare-esp32-s3-audio-voice-lab

features:
  wifi: true
  audio_bus_probe: true
  modular_runtime: true
  application_manager: true
  typed_intents: true
  capability_policy: true
  privacy_gate: true
  voice_recording: true
  voice_effects: true
  effect_count: 5
  reaction_game: true
  reaction_game_inputs: 3
  reaction_game_persistence: false
  local_quiz: true
  local_quiz_pack_count: 3
  local_quiz_maximum_packs: 4
  local_quiz_total_items: 24
  local_quiz_maximum_total_items: 48
  local_quiz_maximum_items: 12
  local_quiz_persistence: false
  local_quiz_packs:
    - nexi.sound-memory.beginner.de@1:6
    - nexi.sound-memory.fast.de@1:9
    - nexi.sound-memory.deep.de@1:9
  local_stories: true
  local_story_pack_count: 2
  local_story_maximum_packs: 4
  local_story_count: 3
  local_story_maximum_total_stories: 12
  local_story_maximum_stories_per_pack: 4
  local_story_maximum_seconds: 120
  local_story_audio: signed_pcm8_mono_8000_hz_embedded_binary_assets
  local_story_persistence: firmware_assets_only
  local_story_packs:
    - nexi.stories.wonder.de@1:2
    - nexi.stories.calm.de@1:1
  local_companion: true
  local_companion_state_version: 2
  local_companion_state_bytes: 16
  local_companion_state_namespace: nexi_friend
  local_companion_state_key: state
  local_companion_state_fields:
    - energy
    - joy
    - trust
    - interactions
  local_companion_actions:
    - play
    - feed
    - rest
  local_companion_save_coalescing_ms: 1000
  local_companion_reset: long_key3_in_companion_mode
  local_companion_network: false
  local_timer: true
  local_timer_clock: esp_monotonic_with_pcf85063_retained_deadline
  local_timer_presets_seconds:
    - 60
    - 180
    - 300
  local_timer_maximum_seconds: 86400
  local_timer_add_seconds: 60
  local_timer_alarm_repeat_ms: 3000
  local_timer_persistence: versioned_local_nvs_deadline
  local_timer_state_version: 1
  local_timer_state_bytes: 28
  local_timer_state_namespace: nexi_timer
  local_timer_state_key: state
  local_timer_rtc: pcf85063_active_local_epoch
  local_timer_rtc_battery_required_for_power_loss: true
  local_timer_deep_sleep: long_key3_while_running
  local_timer_deep_sleep_wake_source: esp32_rtc_timer
  service_button_input: true
  voice_input: personal_local_complete_sentences
  wake_word: Hey Nexi
  voice_sentence_profile_storage: dedicated_local_nvs_quantized_features
  voice_sentence_profile_partition: nexivoice2
  voice_sentence_profile_partition_bytes: 262144
  voice_sentence_profile_legacy_partition: nexivoice
  voice_profile_format_version: 1
  voice_profile_reset: key3_at_startup
  local_voice_examples:
    - Hey Nexi, starte das Stimmenstudio
    - Hey Nexi, stopp
    - Hey Nexi, lauter
    - Hey Nexi, leiser
    - Hey Nexi, naechster Effekt
    - Hey Nexi, starte das Reaktionsspiel
    - Hey Nexi, starte das Klangquiz
    - Hey Nexi, starte die Geschichten
  voice_sentence_references: 2
  local_volume_control: true
  volume_steps: 5

privacy:
  upload_recordings: false
  persist_recordings: false
  recording_seconds: 15
  recording_storage: psram_only
