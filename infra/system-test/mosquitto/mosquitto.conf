per_listener_settings true

# This listener is reachable only on the Compose-internal data-plane network.
# Authentication and device ACL scenarios are added by the device-test workstream.
listener 1883 0.0.0.0
protocol mqtt
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
connection_messages false
log_timestamp true
log_type error
log_type warning
log_type notice
