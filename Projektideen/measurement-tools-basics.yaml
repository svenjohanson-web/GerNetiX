schemaVersion: 1
kind: learning_project_idea
id: project_idea.measurement_tools_basics
slug: umgang-mit-messmitteln
title: Umgang mit Messmitteln
projectStatus: idea
domain: electronics
summary: Du lernst Schritt für Schritt, wie du mit Multimeter, Logikanalysator und Oszilloskop eine Schaltung sicher prüfst und Messwerte verständlich erklärst.
salesRole: Eigenständiges Grundlagen-Lernprojekt für Elektronik und Embedded-Entwicklung.
accessPolicy:
  accessTier: free
  grantModel:
    principle: Die Lerninhalte sollen den sicheren Einstieg in typische Messaufgaben ermöglichen.
targetAudience:
  - Einsteiger in Elektronik und Embedded-Entwicklung
  - Lernende, die Schaltungen nicht nur nachbauen, sondern elektrisch prüfen wollen
  - Maker mit Multimeter und späteren digitalen Messmitteln
hardwareLevel: basic
learnerPromise: Nach dem Projekt weißt du nicht nur, welchen Knopf du drückst. Du kannst vor jeder Messung erklären, was du erwartest, wie du das Messgerät anschließt und ob das Ergebnis plausibel ist.
learningPattern:
  - Vorhersagen: Welche Größe möchte ich messen und welchen Wert oder Verlauf erwarte ich?
  - Aufbauen: Signal einstellen, richtige Buchse wählen und das Messgerät sicher anschließen.
  - Messen: Wert, Einheit, Messbereich und sichtbare Schwankungen protokollieren.
  - Verändern: Immer nur einen Parameter wie Frequenz oder Tastverhältnis ändern.
  - Erklären: Beobachtung mit der Vorhersage vergleichen und die Grenze des Messgeräts benennen.
recommendedHardware:
  - Digitalmultimeter mit Spannungs-, Strom- und Widerstandsmessung sowie mehreren Messbereichen
  - Übungsaufbau mit Batterie oder Kleinspannungsquelle, Widerständen, LED und Schalter
  - Logikanalysator mit digitalen Eingängen und passender PC-Software
  - Oszilloskop mit mindestens einem Tastkopf und geeigneten Masseleitungen
  - Optional: Funktionsgenerator oder Mikrocontroller für reproduzierbare Signale
safetyBoundary:
  - Der Kurs arbeitet ausschließlich mit Batterie, USB und berührsicherer Kleinspannung.
  - Netzspannung und Messungen in Netzgeräten sind ausdrücklich nicht Bestandteil dieses Einsteigerprojekts.
  - Vor jeder Strommessung wird die Schaltung ausgeschaltet. Erst danach werden Buchse, Messart und Anschluss geprüft.
  - Ein Messgerät wird nie parallel zur Quelle im Strommessbereich angeschlossen.
  - Beim Oszilloskop wird vor dem Anschließen geklärt, womit die Masseklemme elektrisch verbunden ist. Eine falsch gesetzte Masseklemme kann einen Kurzschluss verursachen.
