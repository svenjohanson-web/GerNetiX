services:
  runtime-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: forgejo
      POSTGRES_USER: forgejo
      POSTGRES_PASSWORD: ${FORGEJO_TEST_POSTGRES_PASSWORD:?synthetisches Testpasswort fehlt}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgejo -d forgejo"]
      interval: 1s
      timeout: 2s
      retries: 30

  forgejo:
    image: codeberg.org/forgejo/forgejo:15.0.6-rootless
    user: "1000:1000"
    read_only: true
    environment:
      USER_UID: 1000
      USER_GID: 1000
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: runtime-postgres:5432
      FORGEJO__database__NAME: forgejo
      FORGEJO__database__USER: forgejo
      FORGEJO__database__PASSWD: ${FORGEJO_TEST_POSTGRES_PASSWORD:?synthetisches Testpasswort fehlt}
      FORGEJO__database__SSL_MODE: disable
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__security__SECRET_KEY: ${FORGEJO_TEST_SECRET_KEY:?synthetischer Testschluessel fehlt}
      FORGEJO__security__INTERNAL_TOKEN: ${FORGEJO_TEST_INTERNAL_TOKEN:?synthetischer Testtoken fehlt}
      FORGEJO__server__ROOT_URL: http://forgejo:3000/
      FORGEJO__server__HTTP_PORT: 3000
      FORGEJO__server__DISABLE_SSH: "true"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__repository__ENABLE_PUSH_CREATE_USER: "false"
      FORGEJO__actions__ENABLED: "false"
    ports:
      - "127.0.0.1::3000"
    volumes:
      - forgejo_data:/var/lib/gitea
    tmpfs:
      - /tmp
    depends_on:
      runtime-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/api/healthz"]
      interval: 1s
      timeout: 2s
      retries: 60

volumes:
  postgres_data:
  forgejo_data:
