name: Test CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  # Die Matrix wird aus services/ ermittelt, nicht im Workflow gepflegt.
  # Ein neuer Service laeuft dadurch automatisch mit; Ausnahmen stehen mit
  # Begruendung in tools/ci/ci-test-policy.json.
  service-matrix:
    name: Service-Matrix bestimmen
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve service matrix
        id: resolve
        run: node tools/ci/service-test-matrix.js

  service-tests:
    name: ${{ matrix.label }}
    needs: service-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.service-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json
      - name: Install locked dependencies
        working-directory: ${{ matrix.workspace }}
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run syntax entrypoint check
        working-directory: ${{ matrix.workspace }}
        run: npm run check
      - name: Prepare ephemeral test runtime
        run: mkdir -p .runtime services/build-deploy-server/.runtime
      - name: Run service tests
        working-directory: ${{ matrix.workspace }}
        env:
          TEST_SKIP_PATTERN: ${{ matrix.skipPattern }}
        run: |
          if [ -n "$TEST_SKIP_PATTERN" ]; then
            node --test --test-skip-pattern="$TEST_SKIP_PATTERN"
          else
            node --test
          fi

  # Sammelt tools/**/*.test.js per Glob. Neue Tools-Tests laufen ohne
  # Workflow-Aenderung mit; Ausnahmen stehen in tools/ci/ci-test-policy.json.
  tools-tests:
    name: Tools and contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare ephemeral test runtime
        run: mkdir -p .runtime services/build-deploy-server/.runtime
      # Die Tools-Tests kommen ohne installierte Abhaengigkeiten aus; sie nutzen
      # nur node:-Builtins und lesen Quelldateien. Deshalb kein npm ci.
      - name: Run tools and contract tests
        run: node tools/ci/run-tools-tests.js

  customer-data-backup-e2e:
    name: Customer data backup and restore E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run isolated customer data backup and restore
        run: tools/backup-restore-e2e.sh

  forgejo-container-e2e:
    name: Forgejo container and restore E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated Forgejo container integration
        run: tools/forgejo-integration/run.sh
      - name: Run isolated Forgejo backup and restore
        run: tools/forgejo-backup-restore-e2e.sh

  forgejo-ui-e2e:
    name: Forgejo repository card UI E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run session-protected repository card against isolated Forgejo
        run: tools/forgejo-ui-e2e/run.sh

  repository-quality:
    name: Syntax and Compose
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check tracked JavaScript syntax
        run: node tools/ci/check-javascript-syntax.js
      - name: Validate Compose models
        run: node tools/ci/check-compose.js
      - name: Check file size ratchet
        run: node tools/ci/check-file-sizes.js
      - name: Check for committed secrets
        run: node tools/ci/check-committed-secrets.js
      - name: Check HTTP route classification
        run: node tools/internal-api-route-guard/index.js
      - name: Check committed diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          PULL_REQUEST_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --check "$PULL_REQUEST_BASE...$PULL_REQUEST_HEAD"
          else
            git show --check --oneline HEAD
          fi

  architecture-and-graph:
    name: Architecture docs and graph baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Rebuild architecture documentation
        run: node tools/architecture-docs/build.js
      - name: Verify generated documentation diff
        run: git diff --exit-code -- tools/architecture-docs/dist
      - name: Verify canonical graph baseline
        run: node tools/ci/check-graph-baseline.js
